# Install alongside Saphenion's app.conf AFTER obtaining the relay certificate.
map $http_upgrade $ghosty_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name relay.olezierau.de;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.olezierau.de;
    ssl_certificate /etc/letsencrypt/live/relay.olezierau.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.olezierau.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # OAuth callbacks contain single-use codes; don't retain query strings in logs.
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 8k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $ghosty_upstream ghosty-relay:8787;
        proxy_pass http://$ghosty_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghosty_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
    }
}
