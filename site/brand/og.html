<!doctype html>
<meta charset="utf-8">
<title>Hesper Open Graph image</title>
<style>
  /* Rendered to public/og.png by scripts/og.sh. Literal hex is allowed here only: the image
     cannot read tokens at runtime. Values are the Dusk tokens from app/Sources/Hesper/UI/Theme.swift. */
  @font-face { font-family: "Geist"; src: url("../../app/Resources/Fonts/Geist-VF.ttf") format("truetype"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0F1020; color: #D7DBF5; font-family: "Geist", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box; }
  .mark { width: 172px; height: 172px; flex: none; }
  .copy { display: flex; flex-direction: column; gap: 22px; }
  .wm { font-weight: 600; font-size: 34px; letter-spacing: -0.015em; display: inline-flex; align-items: baseline; }
  .wm i { display: inline-block; width: 11px; height: 11px; margin-left: 3px; background: #FF6F91; border-radius: 1px; }
  h1 { margin: 0; font-weight: 600; font-size: 64px; line-height: 1.08; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: #8F9CFF; }
  p { margin: 0; font-size: 25px; line-height: 1.4; color: #7A80A8; max-width: 24em; }
</style>
<img class="mark" src="../public/mark.svg" alt="">
<div class="copy">
  <span class="wm">hesper<i></i></span>
