name: Hesper release
# Tag vX.Y.Z → Hesper.app (with hesperd, hesperctl, hesper-keys) signed with
# the Developer ID, notarized, stapled, attached to a GitHub release.
#
# Inert until these repository secrets exist (the job then only says so):
#   DEVELOPER_ID_P12        base64 of the "Developer ID Application" .p12
#   P12_PASSWORD            its password
#   NOTARY_API_KEY          base64 of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID       its key id
#   NOTARY_API_ISSUER       its issuer id
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
# Nothing by default; the release job alone may write (gh release create).
permissions: {}
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HAVE_SECRETS: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.P12_PASSWORD != '' && secrets.NOTARY_API_KEY != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER != '' }}
    steps:
      - name: Signing secrets missing
        if: env.HAVE_SECRETS != 'true'
        run: |
          echo "::error::Add DEVELOPER_ID_P12, P12_PASSWORD, NOTARY_API_KEY, NOTARY_API_KEY_ID and NOTARY_API_ISSUER."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAVE_SECRETS == 'true'
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false
      - name: Validate release tag
        if: env.HAVE_SECRETS == 'true'
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HAVE_SECRETS == 'true'
        with:
          go-version: "1.25.x"
          cache-dependency-path: relay/go.sum
      - name: Select Xcode 26
        if: env.HAVE_SECRETS == 'true'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Import the Developer ID into a temporary keychain
        if: env.HAVE_SECRETS == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/id.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # libghostty from source without GNU libintl (LGPL), so the released
      # app contains no LGPL code: docs/licensing.md.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.HAVE_SECRETS == 'true'
        with:
          version: 0.16.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghosttykit-cache
        if: env.HAVE_SECRETS == 'true'
        with:
          path: app/Vendor
          key: ghosttykit-${{ matrix.arch }}-${{ hashFiles('app/Package.resolved', 'scripts/build-ghosttykit.sh', 'scripts/ghosttykit/**') }}
      - name: Build libghostty without libintl
        if: env.HAVE_SECRETS == 'true' && steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: scripts/build-ghosttykit.sh
      - name: Release tests
        if: env.HAVE_SECRETS == 'true'
        run: |
          make -C relay test check
          make -C app test-unit test-fake
          scripts/test-install.sh
          python3 scripts/test-release.py
      - name: Build
        if: env.HAVE_SECRETS == 'true'
        run: |
          make -C relay build
          make -C app build VERSION="${RELEASE_TAG#v}"
          scripts/build-ghosttykit.sh --check app/build/Hesper.app/Contents/MacOS/Hesper
      - name: Bundle and sign (as install.sh does)
        if: env.HAVE_SECRETS == 'true'
        run: |
          app=app/build/Hesper.app
          for tool in hesperd hesperctl hesper-keys; do
            cp relay/dist/$tool $app/Contents/MacOS/$tool
          done
          cp packaging/hesper-setup.sh "$app/Contents/Resources/hesper-setup.sh"
          cp -R skills/hesper "$app/Contents/Resources/hesper-skill"
          shasum -a 256 relay/dist/hesperd | cut -d' ' -f1 > $app/Contents/Resources/hesperd.sha256
          codesign --force --options runtime --timestamp --entitlements packaging/hesperd.entitlements --sign "$SIGN_IDENTITY" $app/Contents/MacOS/hesperd
          for tool in hesperctl hesper-keys; do
            codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" $app/Contents/MacOS/$tool
          done
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" $app
          codesign --verify --strict --deep $app
          codesign -dv "$app" 2>&1 | grep -Fx 'TeamIdentifier=JG9EEDCLZB'
      - name: Notarize and staple
        if: env.HAVE_SECRETS == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent app/build/Hesper.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r); sys.exit(0 if r["status"] == "Accepted" else 1)' "$RUNNER_TEMP/notary-result.json"
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple app/build/Hesper.app
          xcrun stapler validate app/build/Hesper.app
          spctl --assess --type execute --verbose app/build/Hesper.app
      - name: Release assets
        if: env.HAVE_SECRETS == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent app/build/Hesper.app "dist/Hesper-$RELEASE_TAG-${{ matrix.arch }}.zip"
          (cd dist && shasum -a 256 ./*.zip > SHA256SUMS)
          {
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
            echo
            echo "libghostty built from source without GNU libintl (no LGPL code in this build; see docs/licensing.md and THIRD_PARTY_NOTICES.md):"
            echo
            echo '```'
            cat app/Vendor/GhosttyKit.source
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAVE_SECRETS == 'true'
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always() && env.HAVE_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/notary.p8"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish signed release
        run: |
          test -f "dist/Hesper-$RELEASE_TAG-arm64.zip"
          test -f "dist/Hesper-$RELEASE_TAG-x86_64.zip"
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Hesper $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Update Homebrew cask
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 scripts/update-homebrew.py "$RELEASE_TAG" dist "$RUNNER_TEMP/release.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/hesper.rb
          if ! git diff --cached --quiet; then
            git commit -m "brew: Hesper $RELEASE_TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
