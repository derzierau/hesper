<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hesper iPhone wireframes, round 1</title>
<style>
  /* Round 1: low fidelity. Grey boxes, no colour except one marker for "needs you". */
  :root { --ink: #222; --mid: #888; --soft: #ddd; --box: #f1f1f1; --mark: #c33; --bg: #fafafa; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; font: 13px/1.35 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: var(--mid); margin: 0 0 24px; max-width: 70ch; }
  .strip { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; width: 300px; }
  figcaption { font-size: 12px; color: var(--mid); margin-top: 8px; }
  figcaption b { color: var(--ink); }
  .phone { width: 300px; height: 650px; border: 2px solid var(--ink); border-radius: 36px; padding: 44px 14px 22px; position: relative; background: #fff; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .phone::before { content: ""; position: absolute; top: 12px; left: 50%; width: 86px; height: 24px; margin-left: -43px; border-radius: 12px; background: var(--ink); }
  .box { background: var(--box); border: 1px dashed var(--mid); border-radius: 6px; padding: 8px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .grow { flex: 1; min-width: 0; }
  .t { font-weight: 600; }
  .s { color: var(--mid); font-size: 11px; }
  .btn { border: 1px solid var(--ink); border-radius: 6px; padding: 4px 8px; font-size: 11px; text-align: center; }
  .btn.fill { background: var(--ink); color: #fff; }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mid); margin-top: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink); flex: none; }
  .dot.r { background: var(--mark); border-color: var(--mark); }
  .dot.f { background: var(--ink); }
  .seg { display: flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .seg span { flex: 1; text-align: center; font-size: 11px; padding: 4px 0; border-left: 1px solid var(--ink); }
  .seg span:first-child { border-left: 0; background: var(--ink); color: #fff; }
  .term { flex: 1; background: #ddd; border-radius: 4px; font: 7px/1.25 ui-monospace, Menlo, monospace; padding: 6px; color: #555; overflow: hidden; white-space: pre; }
  .fab { position: absolute; right: 18px; bottom: 30px; width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 26px; display: grid; place-items: center; }
  .field { border: 1px solid var(--mid); border-radius: 6px; padding: 6px 8px; color: var(--mid); }
  .lock { background: #ccc; border-color: #ccc; }
  .lock .box { background: #e9e9e9; }
  .clock { font-size: 54px; font-weight: 200; text-align: center; }
  .note { border-left: 3px solid var(--mark); padding-left: 6px; }
</style>
</head>
<body>
<h1>Round 1: rough structure</h1>
<p class="lede">First pass at the screens the phone needs, drawn straight from the job list. Deliberately rough: it exists to be criticised. See <code>../critique.md</code> for what round 2 changes.</p>

<div class="strip">

<figure>
  <div class="phone">
    <div class="row"><div class="t grow" style="font-size:20px">Agents</div><div class="btn">⚙︎</div></div>
    <div class="seg"><span>All</span><span>mini</span><span>studio</span><span>air</span></div>
    <div class="sec">Needs you · 2</div>
    <div class="box">
      <div class="row"><div class="dot r"></div><div class="t grow">migrations</div><div class="s">mini · 2m</div></div>
      <div class="s">Allow Bash: npm run db:migrate?</div>
      <div class="row" style="margin-top:6px"><div class="btn fill grow">Allow</div><div class="btn grow">Always</div><div class="btn grow">Deny</div></div>
    </div>
    <div class="box">
      <div class="row"><div class="dot r"></div><div class="t grow">api-docs</div><div class="s">studio · 9m</div></div>
      <div class="s">Which format? 1 OpenAPI 2 Markdown</div>
      <div class="row" style="margin-top:6px"><div class="btn grow">1</div><div class="btn grow">2</div></div>
    </div>
    <div class="sec">Working · 4</div>
    <div class="box row"><div class="dot f"></div><div class="grow">search-index</div><div class="s">mini</div></div>
    <div class="box row"><div class="dot f"></div><div class="grow">ios-push</div><div class="s">air</div></div>
    <div class="box row"><div class="dot f"></div><div class="grow">relay-tests</div><div class="s">studio</div></div>
    <div class="sec">Done · 3</div>
    <div class="box row"><div class="dot"></div><div class="grow">fix-login</div><div class="s">mini</div></div>
    <div class="fab">+</div>
  </div>
  <figcaption><b>1 · Agents.</b> One list, Mac filter on top, answers inline, floating + to start.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="row"><div class="btn">‹</div><div class="grow" style="text-align:center"><div class="t">migrations</div><div class="s">mini · hesper · main</div></div><div class="btn">⋯</div></div>
    <div class="term">╭─ Claude Code ──────────────────────────────────────────────╮
│ ✻ Reading prisma/schema.prisma                             │
│ ⏺ I'll add the users.email index and run the migration.   │
│                                                            │
│ ⏺ Bash(npm run db:migrate)                                 │
│   ⎿ Running…                                               │
│                                                            │
│ Do you want to proceed?                                    │
│ ❯ 1. Yes                                                   │
│   2. Yes, and don't ask again for npm run commands         │
│   3. No, and tell Claude what to do differently (esc)      │
╰────────────────────────────────────────────────────────────╯</div>
    <div class="box">
      <div class="s">Allow Bash: npm run db:migrate?</div>
      <div class="row" style="margin-top:6px"><div class="btn fill grow">Allow</div><div class="btn grow">Always</div><div class="btn grow">Deny</div></div>
    </div>
    <div class="row"><div class="field grow">Reply…</div><div class="btn">🎤</div></div>
    <div class="s" style="text-align:center">● ○ ○ ○ ○ ○</div>
  </div>
  <figcaption><b>2 · Agent.</b> Live terminal, answer box under it, reply field, page dots to swipe between agents.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="row"><div class="btn">Cancel</div><div class="t grow" style="text-align:center">New agent</div><div class="btn fill">Start</div></div>
    <div class="sec">Mac</div>
    <div class="seg"><span>mini</span><span>studio</span><span>air</span></div>
    <div class="sec">Project</div>
    <div class="box row"><div class="grow">hesper</div><div class="s">›</div></div>
    <div class="sec">Agent</div>
    <div class="seg"><span>Claude</span><span>Codex</span><span>Shell</span></div>
    <div class="sec">Profile</div>
    <div class="box row"><div class="grow">default</div><div class="s">›</div></div>
    <div class="sec">Worktree</div>
    <div class="box row"><div class="grow">New worktree</div><div class="s">on</div></div>
    <div class="sec">Task</div>
    <div class="field" style="height:120px">Describe the task…</div>
    <div class="row"><div class="grow"></div><div class="btn">🎤 Dictate</div></div>
  </div>
  <figcaption><b>3 · New agent.</b> A form: Mac, project, kind, profile, worktree, then the task.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="row"><div class="t grow" style="font-size:20px">Macs</div><div class="btn">+ Pair</div></div>
    <div class="box">
      <div class="row"><div class="dot f"></div><div class="t grow">mini</div><div class="s">direct · 4 ms</div></div>
      <div class="s">6 agents · 1 needs you</div>
    </div>
    <div class="box">
      <div class="row"><div class="dot f"></div><div class="t grow">studio</div><div class="s">relay · 48 ms</div></div>
      <div class="s">3 agents · 1 needs you</div>
    </div>
    <div class="box">
      <div class="row"><div class="dot"></div><div class="t grow">air</div><div class="s">offline 2h</div></div>
      <div class="s">lid closed · 2 agents (last seen)</div>
    </div>
    <div class="sec">Projects</div>
    <div class="box row"><div class="grow">hesper</div><div class="s">mini, studio</div></div>
    <div class="box row"><div class="grow">website</div><div class="s">air</div></div>
    <div class="box row"><div class="grow">scratch</div><div class="s">mini</div></div>
  </div>
  <figcaption><b>4 · Macs.</b> Machines with route and latency, then projects.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="row"><div class="btn">‹</div><div class="t grow" style="text-align:center">Review</div><div class="s"></div></div>
    <div class="box"><div class="t">fix-login</div><div class="s">mini · hesper · fix/login · 4 files +86 −12</div></div>
    <div class="box"><div class="s">Result</div>Fixed the token refresh race. Added a test for the expired-token path.</div>
    <div class="sec">Files</div>

    <div class="row"><div class="btn grow">Send back</div><div class="btn fill grow">Accept &amp; commit</div></div>
  </div>
  <figcaption><b>5 · Review.</b> Result, files, evidence, then a verdict.</figcaption>
</figure>

<figure>
  <div class="phone lock">
    <div class="clock">9:41</div>
    <div class="box">
      <div class="row"><div class="t grow">Hesper</div><div class="s">now</div></div>
      <div>2 need you · 4 working</div>
      <div class="s">migrations, api-docs</div>
    </div>

      <div class="row"><div class="t grow">migrations on mini</div><div class="s">2m</div></div>
      <div class="s">Allow Bash: npm run db:migrate?</div>
      <div class="row" style="margin-top:6px"><div class="btn grow">Allow</div><div class="btn grow">Deny</div></div>
    </div>
  </div>

</figure>

<figure>
  <div class="phone">
